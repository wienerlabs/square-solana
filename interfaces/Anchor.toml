# Arayüz sözleşmesi stub'ları (BC-44) için ayrı Anchor workspace'i: yalnızca IDL üretimi.
# Kök Anchor.toml'dan ayrıdır; kök `anchor deploy` / `anchor keys sync` stub'lara dokunmaz.
[features]
resolution = true
skip-lint = false

[workspace]
members = [
  "square-registry-contract",
  "square-policy-contract",
  "square-verifier-contract",
  "square-escrow-contract",
]

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"
