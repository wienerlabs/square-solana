[package]
name = "verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "square-common/idl-build"]

[dependencies]
square-common = { path = "../../crates/square-common" }
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
groth16-solana = "0.2"
# Anchor 1.x `solana_program` yerine ayrık Solana crate'leri (MPP yolu: ed25519 ön derlemesi, talimat sysvar'ı).
solana-instructions-sysvar = "3"
solana-sdk-ids = "3"

[dev-dependencies]
# Program testleri: derlenmiş programı (`anchor build`) LiteSVM'de çalıştırır (crates/square-testkit).
square-testkit = { path = "../../crates/square-testkit" }
