[package]
name = "square-verifier"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Square verifier programı: release ispatının (Groth16, 13 sinyal) job'a bağlanması ve günlük sayaç (BC-21)"

[lib]
crate-type = ["cdylib", "lib"]
name = "square_verifier"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "square-common/idl-build"]
# Anchor makrolarının koşul olarak kullandığı özellikler.
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
# Anchor makroları SBF hedefini (`target_os = "solana"`) koşul olarak kullanır.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
square-common = { path = "../../crates/square-common" }
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
groth16-solana = "0.2"
