[package]
name = "square-registry"
version = "0.2.0"
description = "Square registry programı: did:aip v2 (Solana) agent kaydı, agent card işaretçisi ve hash'i (BC-15)"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "square_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "square-common/idl-build"]
# Anchor makrolarının koşul olarak kullandığı özellikler.
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
square-common = { path = "../../crates/square-common" }
anchor-lang = "1.2.0"

[lints.rust]
# Anchor makroları SBF hedefini (`target_os = "solana"`) koşul olarak kullanır.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
# Program testleri: derlenmiş programı (`anchor build`) LiteSVM'de çalıştırır (crates/square-testkit).
square-testkit = { path = "../../crates/square-testkit" }
