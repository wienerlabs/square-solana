[package]
name = "aip-registry"
version = "0.1.0"
description = "AIP Agent Registry — On-chain agent card storage and discovery"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "aip_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "square-common/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
square-common = { path = "../../crates/square-common" }
anchor-lang = "1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
# Program testleri: derlenmiş programı (`anchor build`) LiteSVM'de çalıştırır (crates/square-testkit).
square-testkit = { path = "../../crates/square-testkit" }
