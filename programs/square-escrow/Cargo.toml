[package]
name = "square-escrow"
version = "0.5.0"
description = "Square escrow programı: kuruma ve registry agent'ına bağlı iş, policy anlık görüntüsü, fonlama, teslimat (BC-22)"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "square_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "square-common/idl-build"]
# Anchor makrolarının koşul olarak kullandığı özellikler.
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
# Anchor makroları SBF hedefini (`target_os = "solana"`) koşul olarak kullanır.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
square-common = { path = "../../crates/square-common" }
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
