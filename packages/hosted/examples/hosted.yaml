# Örnek hosted agent yapılandırması (README "Yapılandırma"). Program kimlikleri IDL'lerdeki adreslerdir; diğer adresler
# biçimi doğru örneklerdir. Dağıtımda kendi değerlerinizle değiştirin. Sırlar burada yoktur: anahtarlar dosya yoluyla,
# API anahtarları ortam değişkeni adıyla verilir. `square-hosted --config examples/hosted.yaml --check` doğrular.
version: 1
agent:
  name: Kurum Araştırma Ajanı
  description: Kurumun araştırma ve çeviri işlerini yürüten hosted agent
  version: 1.0.0
  publicUrl: https://ajan.kurum.example
  agentId: kurum-arastirma
  register: self
  listen: { host: 0.0.0.0, port: 8080 }
  autoListClaim: { discountBps: 300 }
  callers:
    # İş gönderen kurumların API anahtarlarının SHA-256'sı, anahtarın kendisi değil (printf '%s' "$ANAHTAR" | sha256sum).
    - keySha256: abababababababababababababababababababababababababababababababab
      institutions: [7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU]
chain:
  rpcUrl: https://rpc.kurum.example
  commitment: confirmed
  programIds:
    registry: CgchXu2dRV3r9E1YjRhp4kbeLLtv1Xz61yoerJzp1Vbc
    policy: FXD7ycSguBQw7o3DXqq4VUBHtdx5ZQpu9P2zb4KG4ZEU
    verifier: AzKirEv7h5PstLNYNqLj7fCXU9EFA6nSnuoed3QkmUfU
    escrow: 5hstj5grBUL1BeSaPLYpgkD6n3ALasmbseRvKRFfCVNT
api: { baseUrl: https://api.square.example, apiKeyEnv: SQUARE_API_KEY }
store: { type: postgres, urlEnv: DATABASE_URL }
signers:
  agent: { type: keypair, keypairPath: ./keys/agent.json }
  institution: { type: keypair, keypairPath: ./keys/kurum.json }
mcp:
  servers:
    square:
      type: stdio
      command: square-mcp
      env:
        SQUARE_API_URL: https://api.square.example
        SQUARE_NETWORK: devnet
        SQUARE_TIMEOUT_MS: '15000'
    search:
      type: http
      url: https://search.kurum.example/mcp
      headers:
        authorization: { fromEnv: SEARCH_MCP_TOKEN }
  maxConcurrency: 4
  toolCacheTtlMs: 60000
  requestTimeoutMs: 30000
  reconnect: { maxAttempts: 3, backoffMs: 250, maxBackoffMs: 5000 }
capabilities:
  - id: research.brief
    name: Araştırma özeti
    description: Konu hakkında kaynaklı kısa bir araştırma özeti
    tags: [research]
    price: '2000000'
    instructions: |
      You write concise research briefs. Use the search tool for sources and cite them.
      Return Markdown.
    model: claude-opus-5-5
    effort: medium
    tools:
      - server: search
        allow: [web_search, fetch_page]
      - server: square
        allow: [square_get_job]
    limits:
      timeoutMs: 300000
      maxTurns: 12
      maxTokens: 16000
      maxTotalTokens: 400000
      maxConcurrency: 4
      maxQueue: 16
      maxToolResultBytes: 65536
  - id: research.translate
    name: Çeviri delegasyonu
    description: Çeviriyi kurumun politikası altında bir çeviri agent'ına verir
    tags: [translation, delegation]
    price: '3000000'
    instructions: |
      Hire the translation agent with square_delegate_job and report the job address and status.
    model: claude-opus-5-5
    tools:
      - server: square
        allow: [square_discover_agents, square_get_reputation]
    delegation: true
    limits:
      timeoutMs: 120000
      maxTurns: 6
      maxTokens: 8000
      maxTotalTokens: 100000
      maxConcurrency: 2
      maxQueue: 8
      maxToolResultBytes: 65536
delegation:
  policyFile: ./policy.yaml
  defaultCategory: translation
  allowedAgents:
    - agentRecord: 3Jt6uBHTbwVn6Bcdf6VdXsU3m8jFCU4dMjM1dWxWJJ3r
      categories: [translation]
      a2a: { url: https://ceviri.example/a2a, apiKeyEnv: TRANSLATOR_A2A_KEY }
      # Eşik üstü işte Travel Rule kaydının yararlanıcı tarafı (IVMS101 alt kümesi, ADR 0017).
      travelRule:
        beneficiary:
          kind: legal
          primaryIdentifier: Çeviri Hizmetleri Ltd.
          secondaryIdentifier: null
          accountNumber: 3Jt6uBHTbwVn6Bcdf6VdXsU3m8jFCU4dMjM1dWxWJJ3r
          address: { street: null, city: Ankara, postcode: null, country: TR }
          nationalIdentification: null
          dateOfBirth: null
          placeOfBirth: null
          countryOfResidence: TR
        beneficiaryVasp: null
  deadlineSecs: 86400
  challengePeriodSecs: 3600
  ledgerPath: ./state/delegations.json
  # Kaydın kurum tarafı; kayıt Square API'sinde şifreli saklanır, defterde yalnızca commitment durur.
  travelRule:
    originator:
      kind: legal
      primaryIdentifier: Kurum A.Ş.
      secondaryIdentifier: null
      accountNumber: 4Nd1mBQtrMJVYVfKf2PJy9NZUZdTAsp7D4xWLs4gDB4T
      address: { street: null, city: İstanbul, postcode: null, country: TR }
      nationalIdentification: null
      dateOfBirth: null
      placeOfBirth: null
      countryOfResidence: TR
    originatingVasp: null
duties:
  intervalMs: 30000
  discovery: { api: true }
  policyWatch:
    policySecretPath: ./keys/policy-secret.hex
    paymentCategory: translation
    intervalMs: 60000
    prover: { baseUrl: https://api.square.example, apiKeyEnv: PROVER_API_KEY, artifactVersion: 0f3c9a7e1b2d }
  crank: { executeResolution: true, lapseDispute: true }
