      description: |
        Yalnızca job'u açan kurumun güncel yetkilisi (anahtar ya da Squads multisig'inde öneri açabilen üye) ve
        job zincirde `Open` iken. Her yazma yeni bir salt üretir; önceki kayıt değişir. Kaydın `amount` ve
        `mint`'i job'unkiyle aynı olmalı. Fonlanan işin kaydı değişmez (409).
