        - name: institution
          in: query
          description: 'Transferi kaydeden kurum anahtarı.'
          schema: { $ref: './schemas/idl.json#/Address' }
        - name: status
          in: query
          description: 'Transferin durumu.'
          schema: { $ref: '#/components/schemas/CctpTransferStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sayfalı transfer listesi.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CctpTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/cctp/transfers/{transfer}:
    get:
      tags: [cctp]
      operationId: getCctpTransfer
      summary: Tek transfer; attestation'ın ve teslimin durumu.
      parameters:
        - $ref: '#/components/parameters/TransferPath'
      responses:
        '200':
          description: Transfer.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/CctpTransfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/cctp/transfers/{transfer}/tx:
    post:
      tags: [cctp]
      operationId: prepareCctpFundTx
      summary: Kurumun imzalayacağı imzasız tx; mesaj teslim edilmediyse mint ile fonlama tek tx'te.
      description: |
        Mesaj Solana'da teslim edilmediyse `receive_message` ve `fund_job` tek tx'tedir (`receiveAndFund`); relayer
        ya da başkası teslim ettiyse yalnızca `fund_job` (`fund`). Kurumun USDC hesabı yoksa aynı tx'te açılır.
        Tx simüle edilir; zincirde düşecek tx 422 döner. Attestation yoksa, job artık `Open` değilse ya da transfer
        `failed` ise 409.
      security:
        - session: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/TransferPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CctpFundTxRequest' }
      responses:
        '200':
          description: İmzasız tx.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/CctpFundTx' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/SimulationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/tx:
    post:
      tags: [tx]
      operationId: prepareTx
      summary: Bir instruction için imzasız v0 tx hazırlar (8 adımın tamamı).
      description: |
        `call` IDL'den üretilen `InstructionCall` birleşimidir. PDA'lar IDL'deki seed bilgisinden
        sunucuda çözülür; `accounts` yalnızca imzacıları, dış hesapları ve token hesaplarını taşır.
        Tx imzalanıp doğrudan RPC'ye gönderilir.
      security:
        - session: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TxRequest' }
      responses:
        '200':
          description: İmzasız tx.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/UnsignedTx' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/SimulationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/prove:
    post:
      tags: [prover]
      operationId: prove
      summary: payment-compliance devresi için Groth16 ispatı üretir.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProveRequest' }
      responses:
        '200':
          description: İspat ve public input'lar.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/ProveResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/fiat/config:
    get:
      tags: [fiat]
      operationId: getFiatConfig
      summary: Stripe.js'in yayımlanabilir anahtarı, MPP authority'si ve MPP profil kimliği.
      description: Fiat rayı yapılandırılmamışsa 503 `payment_unavailable`.
      responses:
        '200':
          description: Yapılandırma.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/FiatConfig' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/fiat/setup-intents:
    post:
      tags: [fiat]
      operationId: createFiatSetupIntent
      summary: Kurumun off-session ödemesi için kart kaydı (Stripe SetupIntent).
      description: |
        Çağıran `institution`'ın güncel yetkilisi olmalı (kurum anahtarı ya da Squads multisig'inde öneri açabilen
        üye). Kurumun Stripe müşterisi ilk çağrıda açılır. Tarayıcı `stripe.confirmCardSetup(clientSecret)` ile
        onaylar; kart `setup_intent.succeeded` webhook'uyla kaydedilir ve öncekinin yerini alır. Anahtarla gelen istek
        `fiat:pay` kapsamı ister.
      security:
        - session: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiatSetupIntentCreate' }
      responses:
        '201':
          description: SetupIntent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/FiatSetupIntent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/fiat/customers/{institution}:
    get:
      tags: [fiat]
      operationId: getFiatCustomer
      summary: Kurumun Stripe müşterisi ve kayıtlı kartı.
      description: Yalnızca kurumun güncel yetkilisi; anahtarla gelen istek `fiat:pay` kapsamı ister.
      security:
        - session: []
        - apiKey: []
      parameters:
        - name: institution
          in: path
          required: true
          description: Job'ları açan kurum anahtarı (`Job.institution`).
          schema: { $ref: './schemas/idl.json#/Address' }
      responses:
        '200':
          description: Müşteri ve kart.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/FiatCustomer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/jobs/{job}/fiat/payment:
    post:
      tags: [fiat]
      operationId: createFiatPayment
      summary: Teslim edilmiş fiat işin Stripe ödemesi (PaymentIntent).
      description: |
        Job fiat rayında ve `Delivered` olmalı, çağıran job'un kurumunun güncel yetkilisi olmalı, işin başarılı bir
        ödemesi olmamalı (409). Tutar işin tutarıdır: settlement mint'inin taban biriminden sente çevrilir; tam sent
        olmayan ya da Stripe'ın en düşük tutarının altındaki iş 400. Kurumun public günlük tavanı bu ödemeyle aşılıyorsa
        400 (`details.dailyCeiling`). Kurumun gizli politikası ödemeden önce kurumda denetlenir (ADR 0026).

        `offSession: false`: tarayıcıda `stripe.confirmCardPayment(clientSecret)` ile onaylanacak PaymentIntent döner;
        işin açık PaymentIntent'i yeniden kullanılır. `offSession: true`: kurumun kayıtlı kartıyla hemen öder; ödeme
        tamamlanırsa attestation aynı yanıttadır. Kart reddedilir ya da müşterinin onayı gerekirse 402
        `payment_failed` (`details.paymentIntent`, `details.declineCode`). Anahtarla gelen istek `fiat:pay` kapsamı
        ister.
      security:
        - session: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/JobPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiatPaymentCreate' }
      responses:
        '201':
          description: PaymentIntent (ve tamamlandıysa attestation).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/FiatPayment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/jobs/{job}/fiat/mpp:
    post:
      tags: [fiat]
      operationId: payFiatJobMpp
      summary: Fiat işin MPP ile ödenmesi (402 challenge, Stripe Shared Payment Token).
      description: |
        Machine Payments Protocol: credential'sız istek 402 `payment_required` alır; challenge `WWW-Authenticate:
        Payment` başlığındadır (yöntem `stripe`, niyet `charge`, tutar işin tutarı, `networkId` Square'in Stripe
        profili). Ödeyen SPT'yi oluşturup isteği `Authorization: Payment <credential>` ile yineler (`mppx/client`).
        Square PaymentIntent'i SPT ile onaylar; ödeme tamamlanınca yanıt attestation'dır ve `Payment-Receipt`
        başlığını taşır. Kimlik `X-API-Key` (`fiat:pay`) ile gelir: `Authorization` credential'ındır. Job, yetki ve
        tutar kuralları `createFiatPayment`'takilerdir. Stripe profili yapılandırılmamışsa 503 `payment_unavailable`.
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/JobPath'
      responses:
        '200':
          description: Ödeme alındı; attestation.
          headers:
            Payment-Receipt:
              description: MPP makbuzu (`reference` PaymentIntent kimliği).
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/FiatAttestation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/jobs/{job}/fiat/attestation:
    get:
      tags: [fiat]
      operationId: getFiatAttestation
      summary: Fiat işin ödemesinin makbuzu ve MPP authority'nin attestation'ı.
      description: |
        Yalnızca job'un kurumunun güncel yetkilisi; anahtarla gelen istek `fiat:pay` kapsamı ister. Attestation
        başka bir MPP authority anahtarıyla imzalanmışsa (rotasyon, upgrade runbook'u §7) güncel anahtarla yeniden
        imzalanır. Ödeme yoksa 404.
      security:
        - session: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/JobPath'
      responses:
        '200':
          description: Attestation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/FiatAttestation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [fiat]
      operationId: reconcileFiatPayment
      summary: Webhook gelmediyse işin PaymentIntent'lerini Stripe'tan okuyup attestation yazar.
      description: |
        İşin bu API'de açılmış PaymentIntent'leri Stripe'tan okunur; başarılı olan varsa attestation yazılır ve döner
        (kaynak `reconcile`). Attestation zaten varsa o döner. Başarılı ödeme yoksa 404. Yetki `getFiatAttestation`'ınkidir.
      security:
        - session: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/JobPath'
      responses:
        '200':
          description: Attestation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/FiatAttestation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/stripe/webhook:
    post:
      tags: [fiat]
      operationId: receiveStripeWebhook
      summary: Stripe'ın imzalı olayları (`payment_intent.succeeded`, `setup_intent.succeeded`).
      description: |
        Stripe çağırır. Gövde ham baytlarıyla `Stripe-Signature`'a (HMAC-SHA256, webhook sırrı) karşı doğrulanır;
        imzası tutmayan ya da zaman damgası 300 saniyeden eski olay 400 alır. `payment_intent.succeeded`, metadata'sında
        Square job'u olan ödemenin attestation'ını yazar. Aynı olay ve aynı PaymentIntent yeniden gelirse kayıt
        değişmez. Attestation'ı olan işe gelen ikinci başarılı ödeme iade edilir. Diğer olaylar kayıtsız alınır.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: '`t=<unix>,v1=<hex HMAC>`.'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Stripe olay nesnesi. }
      responses:
        '200':
          description: Alındı.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/StripeWebhookReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Süreç sağlığı (zarfsız).
      responses:
        '200':
          description: Sağlık durumu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Servis çalışmıyor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /ready:
    get:
      tags: [health]
      operationId: getReady
      summary: Bağımlılıklar (DB, RPC) hazır mı (zarfsız).
      responses:
        '200':
          description: Hazır.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Hazır değil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

webhooks:
  arbitrationNotification:
    post:
      tags: [arbitration]
      operationId: arbitrationNotification
      summary: Arbitrator'ın kaydettiği uca gönderilen dispute bildirimi.
      description: |
        [Standard Webhooks](https://www.standardwebhooks.com) imzası: `webhook-id` (teslimat kimliği; yeniden
        denemelerde aynı), `webhook-timestamp` (Unix saniyesi), `webhook-signature: v1,<base64>` =
        HMAC-SHA256(sır, `id.zaman.gövde`). Alıcı `@squaresdk/solana-hardening`'in `verifyWebhook`'uyla doğrular.
        2xx dışındaki yanıt üstel geri çekilmeyle yeniden denenir.
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: Teslimat kimliği; yeniden denemelerde aynı kalır.
          schema: { type: string }
        - name: webhook-timestamp
          in: header
          required: true
          description: İmzanın anı, Unix saniyesi.
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: webhook-signature
          in: header
          required: true
          description: 'İmza: `v1,<base64>` = HMAC-SHA256(sır, `id.zaman.gövde`).'
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArbitrationNotification' }
      responses:
        '200':
          description: Alındı (her 2xx teslimatı tamamlar).
        '400':
          description: Reddedildi; teslimat yeniden denenir.

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: '`POST /v1/auth/session` ile alınan oturum belirteci.'
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: '`POST /v1/api-keys` ile oluşturulan anahtar.'

  parameters:
    Page:
      name: page
      in: query
      description: "Sayfa numarası (1'den)."
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: 'Sayfa başına kayıt (1–200).'
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    JobPath:
      name: job
      in: path
      required: true
      description: Job PDA adresi.
      schema: { $ref: './schemas/idl.json#/Address' }
    PolicyPath:
      name: policy
      in: path
      required: true
      description: Policy PDA adresi.
      schema: { $ref: './schemas/idl.json#/Address' }
    AgentRecordPath:
      name: agentRecord
      in: path
      required: true
      description: AgentRecord PDA adresi (did:aip v2 Solana tanımlayıcısının son parçası).
      schema: { $ref: './schemas/idl.json#/Address' }
    TransferPath:
      name: transfer
      in: path
      required: true
      description: CCTP transferinin kimliği.
      schema: { type: string, format: uuid }
    X402EndpointPath:
      name: id
      in: path
      required: true
      description: Ücretli uç nokta tanımının kimliği.
      schema: { type: string, minLength: 1 }

  responses:
    BadRequest:
      description: Geçersiz istek.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Kimlik doğrulama gerekli ya da geçersiz.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Yetki yok.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Kaynak bulunamadı.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: İstek sunucunun durumuyla çelişiyor (ör. prover'da yüklü zkey başka; `details.expected`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Hız sınırı aşıldı.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SimulationFailed:
      description: Tx simülasyonu başarısız; zincir hatası `programError` alanında.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PaymentRequired:
      description: 'MPP: ödeme gerekli (`payment_required`); challenge `WWW-Authenticate: Payment` başlığında.'
      headers:
        WWW-Authenticate:
          description: MPP challenge'ı (yöntem `stripe`, niyet `charge`).
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PaymentFailed:
      description: Stripe ödemeyi reddetti ya da müşterinin onayını istiyor (`payment_failed`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: Bağımlı servis kullanılamıyor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ------------------------------------------------------------ zarf
    ApiErrorCode:
      type: string
      enum:
        - invalid_input
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - program_error
        - simulation_failed
        - rpc_unavailable
        - db_unavailable
        - prover_unavailable
        - payment_required
        - payment_failed
        - payment_unavailable
        - internal_error
    ProgramErrorRef:
      type: object
      description: Kodlar her programda 6000'den başlar; (program, code) çifti tekildir.
      required: [program, code, name]
      additionalProperties: false
      properties:
        program: { type: string, enum: [registry, policy, verifier, escrow] }
        code: { type: integer }
        name: { type: string }
    ApiError:
      type: object
      required: [code, message, programError, details]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/ApiErrorCode' }
        message: { type: string }
        programError:
          oneOf:
            - $ref: '#/components/schemas/ProgramErrorRef'
            - type: 'null'
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
    ResponseMeta:
      type: object
      required: [requestId, page, limit, total]
      additionalProperties: false
      properties:
        requestId: { type: string }
        page: { type: [integer, 'null'], minimum: 1 }
        limit: { type: [integer, 'null'], minimum: 1, maximum: 200 }
        total: { type: [integer, 'null'], minimum: 0 }
    SuccessBase:
      type: object
      required: [success, data, error, meta]
      properties:
        success: { type: boolean, const: true }
        data: {}
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    ErrorResponse:
      type: object
      required: [success, data, error, meta]
      additionalProperties: false
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        error: { $ref: '#/components/schemas/ApiError' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }

    # ------------------------------------------------------------ görünümler
    JobView:
      type: object
      required: [address, account, payee, claim, releaseProof, validation, slot, indexedAt]
      additionalProperties: false
      properties:
        address: { $ref: './schemas/idl.json#/Address' }
        account: { $ref: './schemas/idl.json#/Job' }
        payee:
          $ref: './schemas/idl.json#/Address'
          description: Satılmış alacakta alıcı, değilse agentWallet.
        claim:
          oneOf:
            - $ref: './schemas/idl.json#/ClaimListing'
            - type: 'null'
        releaseProof:
          oneOf:
            - $ref: './schemas/idl.json#/ReleaseProof'
            - type: 'null'
        validation:
          oneOf:
            - $ref: './schemas/idl.json#/ValidationRecord'
            - type: 'null'
        slot: { type: integer, minimum: 0 }
        indexedAt: { type: integer, format: int64 }
    InstitutionView:
      type: object
      required: [address, account, slot, indexedAt]
      additionalProperties: false
      properties:
        address: { $ref: './schemas/idl.json#/Address' }
        account: { $ref: './schemas/idl.json#/Institution' }
        slot: { type: integer, minimum: 0 }
        indexedAt: { type: integer, format: int64 }
    PolicyMeta:
      type: object
      description: Herkese açık meta veri; kuralların kendisi asla API'ye gelmez.
      required: [name, description, labels, updatedAt]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        labels:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 40 }
        updatedAt: { type: integer, format: int64 }
    PolicyView:
      type: object
      required: [address, account, meta, slot, indexedAt]
      additionalProperties: false
      properties:
        address: { $ref: './schemas/idl.json#/Address' }
        account: { $ref: './schemas/idl.json#/Policy' }
        meta:
          oneOf:
            - $ref: '#/components/schemas/PolicyMeta'
            - type: 'null'
        slot: { type: integer, minimum: 0 }
        indexedAt: { type: integer, format: int64 }
    AgentView:
      type: object
      required: [address, account, did, card, cardVerified, reputation, slot, indexedAt]
      additionalProperties: false
      properties:
        address: { $ref: './schemas/idl.json#/Address' }
        account: { $ref: './schemas/idl.json#/AgentRecord' }
        did: { type: string, pattern: '^did:[a-z0-9]+:[A-Za-z0-9._:%-]+$' }
        card:
          oneOf:
            - $ref: '#/components/schemas/AgentCard'
            - type: 'null'
        cardVerified:
          type: boolean
          description: Kartın SHA-256'sı zincirdeki agentCardHash ile eşleşiyor mu.
        reputation:
          oneOf:
            - $ref: './schemas/idl.json#/AgentReputation'
            - type: 'null'
        slot: { type: integer, minimum: 0 }
        indexedAt: { type: integer, format: int64 }
    ClaimView:
      type: object
      required: [address, job, account, slot, indexedAt]
      additionalProperties: false
      properties:
        address: { $ref: './schemas/idl.json#/Address' }
        job: { $ref: './schemas/idl.json#/Address' }
        account: { $ref: './schemas/idl.json#/ClaimListing' }
        slot: { type: integer, minimum: 0 }
        indexedAt: { type: integer, format: int64 }
    DisputeView:
      type: object
      required: [job, jobStatus, institution, agentRecord, dispute, slot, indexedAt]
      additionalProperties: false
      properties:
        job: { $ref: './schemas/idl.json#/Address' }
        jobStatus: { $ref: './schemas/idl.json#/JobStatus' }
        institution: { $ref: './schemas/idl.json#/Address' }
        agentRecord: { $ref: './schemas/idl.json#/Address' }
        dispute: { $ref: './schemas/idl.json#/DisputeInfo' }
        slot: { type: integer, minimum: 0 }
        indexedAt: { type: integer, format: int64 }
    ScreeningView:
      type: object
      required: [address, account, fresh, slot, indexedAt]
      additionalProperties: false
      properties:
        address: { $ref: './schemas/idl.json#/Address' }
        account: { $ref: './schemas/idl.json#/ScreeningRecord' }
        fresh:
          type: boolean
          description: status == clear ve expiresAt > now.
        slot: { type: integer, minimum: 0 }
        indexedAt: { type: integer, format: int64 }

    # ------------------------------------------------------------ agent card
    AgentSkill:
      type: object
      required: [id, name, description, tags]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 40 }
        examples:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 500 }
    AgentRegistration:
      type: object
      required: [agentRegistry, agentId]
      additionalProperties: false
      properties:
        agentRegistry:
          type: string
          description: 'solana:{chain-ref}:{registry}'
          pattern: '^solana:[1-9A-HJ-NP-Za-km-z]{32}:[1-9A-HJ-NP-Za-km-z]{32,44}$'
        agentId: { $ref: './schemas/idl.json#/Address' }
    AgentPricing:
      type: object
      required: [skillId, amount, mint]
      additionalProperties: false
      properties:
        skillId: { type: string, minLength: 1, maxLength: 64 }
        amount: { $ref: './schemas/idl.json#/U64' }
        mint: { $ref: './schemas/idl.json#/Address' }
    AgentCard:
      type: object
      description: >-
        Tek kart şeması: ERC-8004 kayıt dosyası (type, services, registrations, active; did:aip v2 §5) ve
        A2A AgentCard (url, capabilities, skills …). services, endpoint'i url ile aynı bir A2A girdisi içerir.
      required:
        [
          type,
          name,
          description,
          url,
          version,
          capabilities,
          defaultInputModes,
          defaultOutputModes,
          skills,
          services,
          registrations,
        ]
      additionalProperties: false
      properties:
        type: { type: string, const: 'https://eips.ethereum.org/EIPS/eip-8004#registration-v1' }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 4000 }
        url: { type: string, format: uri, pattern: '^https://' }
        version: { type: string, minLength: 1, maxLength: 32 }
        provider:
          type: object
          required: [organization, url]
          additionalProperties: false
          properties:
            organization: { type: string, minLength: 1, maxLength: 120 }
            url: { type: string, format: uri, pattern: '^https://' }
        capabilities:
          type: object
          additionalProperties: false
          properties:
            streaming: { type: boolean, default: false }
            pushNotifications: { type: boolean, default: false }
        defaultInputModes:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        defaultOutputModes:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        skills:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/AgentSkill' }
        services:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/AgentService' }
        active: { type: boolean, description: 'false: sahip ajanı kart üzerinden duraklattı' }
        x402Support: { type: boolean }
        registrations:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AgentRegistration' }
        pricing:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/AgentPricing' }
        supportedInterfaces:
          type: array
          description: "A2A v1.0 istemcilerinin uç noktayı okuduğu alan; verilirse url'i kartın url'i ile aynı bir girdi içerir."
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/AgentInterface' }
    AgentInterface:
      type: object
      description: 'A2A v1.0 AgentInterface. Square yalnızca JSON-RPC bağlamasını sunar.'
      required: [url, protocolBinding, protocolVersion]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, pattern: '^https://' }
        protocolBinding: { type: string, const: JSONRPC }
        protocolVersion: { type: string, pattern: '^\d{1,4}\.\d{1,4}$' }
    AgentService:
      type: object
      description: 'Kartın servis girdisi; DID belgesinde {did}#{name-slug} olur. endpoint bir URL ya da DID.'
      required: [name, endpoint]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        endpoint: { type: string, minLength: 1, maxLength: 512 }
        version: { type: string, minLength: 1, maxLength: 32 }
    AgentCardHosting:
      type: object
      required: [agentCardUri, agentCardHash]
      additionalProperties: false
      properties:
        agentCardUri: { type: string, minLength: 1, maxLength: 200, description: update_agent argümanı }
        agentCardHash: { $ref: './schemas/idl.json#/Hex32' }

    # ------------------------------------------------------------ event'ler
    IndexedEvent:
      type: object
      required: [signature, slot, blockTime, instructionIndex, eventIndex, payload]
      additionalProperties: false
      properties:
        signature: { type: string, pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$' }
        slot: { type: integer, minimum: 0 }
        blockTime: { type: [integer, 'null'], format: int64 }
        instructionIndex: { type: integer, minimum: 0 }
        eventIndex: { type: integer, minimum: 0 }
        payload: { $ref: './schemas/idl.json#/ProgramEventPayload' }

    # ------------------------------------------------------------ auth
    AuthChallengeRequest:
      type: object
      required: [wallet]
      additionalProperties: false
      properties:
        wallet: { $ref: './schemas/idl.json#/Address' }
    AuthChallenge:
      type: object
      required: [nonce, message, expiresAt]
      additionalProperties: false
      properties:
        nonce: { type: string, minLength: 16 }
        message: { type: string, minLength: 1, description: Cüzdanın imzalayacağı tam metin. }
        expiresAt: { type: integer, format: int64 }
    SessionRequest:
      type: object
      required: [wallet, nonce, signature]
      additionalProperties: false
      properties:
        wallet: { $ref: './schemas/idl.json#/Address' }
        nonce: { type: string, minLength: 16 }
        signature: { type: string, pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$', description: 'Ed25519 imzası, base58.' }
    Session:
      type: object
      required: [token, wallet, expiresAt]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1 }
        wallet: { $ref: './schemas/idl.json#/Address' }
        expiresAt: { type: integer, format: int64 }
    ApiKeyScope:
      type: string
      enum: [read, 'tx:prepare', 'deliveries:write', 'agents:write', prove, 'disputes:write', 'x402:serve', 'fiat:pay']
    ApiKey:
      type: object
      required: [id, label, prefix, scopes, createdAt, lastUsedAt]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        label: { type: string, minLength: 1, maxLength: 80 }
        prefix: { type: string, minLength: 4, maxLength: 16 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ApiKeyScope' }
        createdAt: { type: integer, format: int64 }
        lastUsedAt: { type: [integer, 'null'], format: int64 }
    ApiKeyCreate:
      type: object
      required: [label, scopes]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ApiKeyScope' }
    ApiKeyCreated:
      type: object
      required: [apiKey, secret]
      additionalProperties: false
      properties:
        apiKey: { $ref: '#/components/schemas/ApiKey' }
        secret: { type: string, minLength: 32, description: Yalnızca bu yanıtta döner. }

    # ------------------------------------------------------------ x402 ücretli uç noktalar
    X402Network:
      type: string
      description: x402 v2 Solana ağı (CAIP-2) - mainnet, devnet, testnet.
      enum:
        - 'solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp'
        - 'solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1'
        - 'solana:4uhcVJyU9pJkvQyS88uRDiswHXSCkY3z'
    X402Path:
      type: string
      maxLength: 200
      pattern: "^/[A-Za-z0-9._~!$&'()*+,;=:@%/-]*$"
      description: Geliştiricinin sunucusundaki route yolu; cüzdan başına tekil.
    X402Endpoint:
      type: object
      required: [id, name, path, description, amount, mint, network, payTo, enabled, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 80 }
        path: { $ref: '#/components/schemas/X402Path' }
        description: { type: [string, 'null'], maxLength: 500 }
        amount:
          allOf:
            - $ref: './schemas/idl.json#/U64'
          description: Çağrı başına fiyat, mint'in taban biriminde; sıfırdan büyük.
        mint: { $ref: './schemas/idl.json#/Address' }
        network: { $ref: '#/components/schemas/X402Network' }
        payTo:
          allOf:
            - $ref: './schemas/idl.json#/Address'
          description: Ödemeyi alan cüzdan (ATA'sı mint'e göre türetilir).
        enabled: { type: boolean, description: Pasif uç nokta ödeme istemez ve çağrıyı geçirmez. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    X402EndpointCreate:
      type: object
      required: [name, path, description, amount, mint, network, payTo, enabled]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        path: { $ref: '#/components/schemas/X402Path' }
        description: { type: [string, 'null'], maxLength: 500 }
        amount: { $ref: './schemas/idl.json#/U64' }
        mint: { $ref: './schemas/idl.json#/Address' }
        network: { $ref: '#/components/schemas/X402Network' }
        payTo: { $ref: './schemas/idl.json#/Address' }
        enabled: { type: boolean }
    X402EndpointUpdate:
      type: object
      description: Kısmi güncelleme; verilmeyen alan değişmez.
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        path: { $ref: '#/components/schemas/X402Path' }
        description: { type: [string, 'null'], maxLength: 500 }
        amount: { $ref: './schemas/idl.json#/U64' }
        mint: { $ref: './schemas/idl.json#/Address' }
        network: { $ref: '#/components/schemas/X402Network' }
        payTo: { $ref: './schemas/idl.json#/Address' }
        enabled: { type: boolean }
    X402PaymentReport:
      type: object
      required: [fingerprint, transaction, network, asset, amount, payer, payTo, settledAt]
      additionalProperties: false
      properties:
        fingerprint:
          type: string
          pattern: '^(svm|json):[0-9a-f]{64}$'
          description: Ödeme yükünün tekrar koruması kimliği (`paymentFingerprint`); ağ başına tekil.
        transaction:
          type: string
          pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$'
          description: Uzlaştırma makbuzunun (`PAYMENT-RESPONSE`) işlem imzası.
        network: { $ref: '#/components/schemas/X402Network' }
        asset: { $ref: './schemas/idl.json#/Address' }
        amount: { $ref: './schemas/idl.json#/U64' }
        payer: { $ref: './schemas/idl.json#/Address' }
        payTo: { $ref: './schemas/idl.json#/Address' }
        settledAt: { type: integer, format: int64 }
    X402Payment:
      type: object
      required: [id, endpointId, fingerprint, transaction, network, asset, amount, payer, payTo, settledAt, reportedAt]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        endpointId: { type: string, minLength: 1 }
        fingerprint: { type: string, pattern: '^(svm|json):[0-9a-f]{64}$' }
        transaction: { type: string, pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$' }
        network: { $ref: '#/components/schemas/X402Network' }
        asset: { $ref: './schemas/idl.json#/Address' }
        amount: { $ref: './schemas/idl.json#/U64' }
        payer: { $ref: './schemas/idl.json#/Address' }
        payTo: { $ref: './schemas/idl.json#/Address' }
        settledAt: { type: integer, format: int64 }
        reportedAt: { type: integer, format: int64 }
    X402UsageTotal:
      type: object
      required: [network, asset, amount, payments]
      additionalProperties: false
      properties:
        network: { $ref: '#/components/schemas/X402Network' }
        asset: { $ref: './schemas/idl.json#/Address' }
        amount: { $ref: './schemas/idl.json#/U64' }
        payments: { type: integer, minimum: 0 }
    X402EndpointUsage:
      type: object
      required: [endpointId, payments, totals, lastPaidAt, recent]
      additionalProperties: false
      properties:
        endpointId: { type: string, minLength: 1 }
        payments: { type: integer, minimum: 0, description: Uzlaştırılmış (ödemeli) çağrı sayısı. }
        totals:
          type: array
          description: Ağ ve mint başına tahsil edilen toplam.
          items: { $ref: '#/components/schemas/X402UsageTotal' }
        lastPaidAt: { type: [integer, 'null'], format: int64 }
        recent:
          type: array
          description: Son ödemeler, yeniden eskiye.
          maxItems: 20
          items: { $ref: '#/components/schemas/X402Payment' }

    # ------------------------------------------------------------ tx, teslimat, prover
    TxRequest:
      type: object
      required: [call, accounts, feePayer, computeUnitPrice]
      additionalProperties: false
      properties:
        call: { $ref: './schemas/idl.json#/InstructionCall' }
        accounts:
          type: object
          description: Türetilemeyen hesaplar (imzacılar, dış hesaplar, token hesapları), IDL hesap adıyla.
          additionalProperties: { $ref: './schemas/idl.json#/Address' }
        feePayer: { $ref: './schemas/idl.json#/Address' }
        computeUnitPrice:
          oneOf:
            - $ref: './schemas/idl.json#/U64'
            - type: 'null'
    UnsignedTx:
      type: object
      required:
        [
          transaction,
          blockhash,
          lastValidBlockHeight,
          feePayer,
          signers,
          addressLookupTables,
          computeUnitLimit,
          simulatedUnits,
        ]
      additionalProperties: false
      properties:
        transaction: { type: string, contentEncoding: base64, description: İmzasız v0 VersionedTransaction. }
        blockhash: { type: string, minLength: 32 }
        lastValidBlockHeight: { type: integer, minimum: 0 }
        feePayer: { $ref: './schemas/idl.json#/Address' }
        signers:
          type: array
          minItems: 1
          items: { $ref: './schemas/idl.json#/Address' }
        addressLookupTables:
          type: array
          items: { $ref: './schemas/idl.json#/Address' }
        computeUnitLimit: { type: integer, minimum: 0 }
        simulatedUnits: { type: [integer, 'null'], minimum: 0 }
    DeliveryReceipt:
      type: object
      required: [workHash, deliveryUri, contentType, size]
      additionalProperties: false
      properties:
        workHash: { $ref: './schemas/idl.json#/Hex32' }
        deliveryUri: { type: string, minLength: 1, maxLength: 128 }
        contentType: { type: string, minLength: 1, maxLength: 120 }
        size: { type: integer, minimum: 0 }
    ProveRequest:
      type: object
      description: |
        Güven sınırı: witness politikanın kendisini içerir; servisi işleten taraf politikayı görür.
        Kurum kendi prover'ını çalıştırmalı ya da in-process proving kullanmalı.
      required: [circuit, artifactVersion, witness]
      additionalProperties: false
      properties:
        circuit: { type: string, const: payment-compliance }
        artifactVersion: { $ref: './schemas/idl.json#/Hex32' }
        witness:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items: { type: string }
    ProveResponse:
      type: object
      required: [artifactVersion, proofA, proofB, proofC, publicInputs, provingMs]
      additionalProperties: false
      properties:
        artifactVersion: { $ref: './schemas/idl.json#/Hex32' }
        proofA: { type: string, pattern: '^[0-9a-f]{128}$' }
        proofB: { type: string, pattern: '^[0-9a-f]{256}$' }
        proofC: { type: string, pattern: '^[0-9a-f]{128}$' }
        publicInputs:
          type: array
          description: Release devresinin 13 public sinyali, devre sırasıyla (release-circuit.md §2).
          minItems: 13
          maxItems: 13
          items: { $ref: './schemas/idl.json#/Hex32' }
        provingMs: { type: integer, minimum: 0 }

    # ------------------------------------------------------------ keeper, health
    KeeperActionKind:
      type: string
      enum: [finalizePayment, executeResolution, lapseDispute]
    KeeperOutcome:
      type: string
      enum: [submitted, confirmed, skipped, failed]
    KeeperReason:
      type: string
      enum: [challengeOpen, proofRequired, staleProof, screeningPending, unprofitable, rpcError, programError]
    KeeperAction:
      type: object
      required: [id, job, action, outcome, reason, signature, keeperFee, at, nextAttemptAt]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        job: { $ref: './schemas/idl.json#/Address' }
        action: { $ref: '#/components/schemas/KeeperActionKind' }
        outcome: { $ref: '#/components/schemas/KeeperOutcome' }
        reason:
          oneOf:
            - $ref: '#/components/schemas/KeeperReason'
            - type: 'null'
        signature: { type: [string, 'null'], pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$' }
        keeperFee:
          oneOf:
            - $ref: './schemas/idl.json#/U64'
            - type: 'null'
        at: { type: integer, format: int64 }
        nextAttemptAt: { type: [integer, 'null'], format: int64 }
    # ------------------------------------------------------------ uyuşmazlık (BE-22)
    DisputeEvidenceRole:
      type: string
      enum: [institution, agent, arbitrator]
    DisputeEvidence:
      type: object
      required: [id, job, reasonHash, contentType, size, role, uploadedBy, isDisputeReason, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        job: { $ref: './schemas/idl.json#/Address' }
        reasonHash:
          $ref: './schemas/idl.json#/Hex32'
          description: İçeriğin SHA-256'sı; kurumun kanıtında raise_dispute'un reason_hash argümanı.
        contentType: { type: string, minLength: 1, maxLength: 120 }
        size: { type: integer, minimum: 0 }
        role: { $ref: '#/components/schemas/DisputeEvidenceRole' }
        uploadedBy: { $ref: './schemas/idl.json#/Address' }
        isDisputeReason:
          type: boolean
          description: Zincirdeki dispute'un reasonHash'i bu içeriğin hash'i mi.
        createdAt: { type: integer, format: int64 }
    DisputeVoteRecord:
      type: object
      description: DisputeVote event'inden bir oy.
      required: [arbitrator, resolution, approvalCount, signature, slot, blockTime]
      additionalProperties: false
      properties:
        arbitrator: { $ref: './schemas/idl.json#/Address' }
        resolution: { $ref: './schemas/idl.json#/DisputeResolution' }
        approvalCount: { type: integer, minimum: 1, maximum: 7 }
        signature: { type: string, pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$' }
        slot: { type: integer, minimum: 0 }
        blockTime: { type: [integer, 'null'], format: int64 }
    ArbitrationQueueItem:
      type: object
      required: [dispute, votes, hasVoted, canVote, threshold, evidence]
      additionalProperties: false
      properties:
        dispute: { $ref: '#/components/schemas/DisputeView' }
        votes:
          type: array
          description: Dispute açıldıktan sonraki oylar, eskiden yeniye.
          items: { $ref: '#/components/schemas/DisputeVoteRecord' }
        hasVoted: { type: boolean, description: Arbitrator güncel sayımda oy verdi mi. }
        canVote: { type: boolean, description: Oy yok ve son tarih geçmedi. }
        threshold: { type: integer, minimum: 2, maximum: 7, description: Karar için gereken onay (M). }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/DisputeEvidence' }
    DisputeVoteRequest:
      type: object
      required: [resolution, feePayer, computeUnitPrice]
      additionalProperties: false
      properties:
        resolution: { $ref: './schemas/idl.json#/DisputeResolution' }
        feePayer:
          description: Boşsa arbitrator'ın kendisi.
          oneOf:
            - $ref: './schemas/idl.json#/Address'
            - type: 'null'
        computeUnitPrice:
          oneOf:
            - $ref: './schemas/idl.json#/U64'
            - type: 'null'
    ArbitrationEventType:
      type: string
      enum: [dispute.raised, dispute.escalated, dispute.vote, dispute.decided, dispute.deadline]
    ArbitrationWebhook:
      type: object
      required: [id, url, events, createdAt]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        url: { type: string, format: uri, maxLength: 512 }
        events:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ArbitrationEventType' }
        createdAt: { type: integer, format: int64 }
    ArbitrationWebhookCreate:
      type: object
      required: [url, events]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 512, description: https; özel ağ adresleri reddedilir. }
        events:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ArbitrationEventType' }
    ArbitrationWebhookCreated:
      type: object
      required: [webhook, secret]
      additionalProperties: false
      properties:
        webhook: { $ref: '#/components/schemas/ArbitrationWebhook' }
        secret: { type: string, minLength: 32, description: 'whsec_ sırrı; yalnızca bu yanıtta döner.' }
    ArbitrationNotification:
      type: object
      required: [type, timestamp, job, deadline, event]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/ArbitrationEventType' }
        timestamp: { type: integer, format: int64 }
        job: { $ref: './schemas/idl.json#/Address' }
        deadline: { type: [integer, 'null'], format: int64 }
        event:
          description: Bildirimi doğuran zincir event'i; dispute.deadline'da null.
          oneOf:
            - $ref: '#/components/schemas/IndexedEvent'
            - type: 'null'

    Health:
      type: object
      required: [status, version, checks]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string, minLength: 1 }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }

    # ------------------------------------------------------------ Travel Rule (BE-23, ADR 0017)
    TravelRuleAddress:
      type: object
      required: [street, city, postcode, country]
      additionalProperties: false
      properties:
        street: { type: [string, 'null'], minLength: 1, maxLength: 140 }
        city: { type: string, minLength: 1, maxLength: 70 }
        postcode: { type: [string, 'null'], minLength: 1, maxLength: 16 }
        country: { $ref: '#/components/schemas/CountryCode' }
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2.
      pattern: '^[A-Z]{2}$'
    TravelRuleIdentifierType:
      type: string
      description: IVMS101 `NationalIdentifierTypeCode`.
      enum: [ARNU, CCPT, RAID, DRLC, FIIN, TXID, SOCS, IDCD, LEIX, MISC]
    TravelRuleNationalId:
      type: object
      required: [type, value, country]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/TravelRuleIdentifierType' }
        value: { type: string, minLength: 1, maxLength: 35 }
        country:
          oneOf:
            - $ref: '#/components/schemas/CountryCode'
            - type: 'null'
    TravelRulePersonKind:
      type: string
      enum: [natural, legal]
    TravelRulePerson:
      type: object
      description: |
        Originator ya da beneficiary (IVMS101 alan adları). Gerçek kişide `primaryIdentifier` soyad,
        `secondaryIdentifier` ad; tüzel kişide `primaryIdentifier` unvandır, `secondaryIdentifier`,
        `dateOfBirth` ve `placeOfBirth` null'dır.
      required:
        [
          kind,
          primaryIdentifier,
          secondaryIdentifier,
          accountNumber,
          address,
          nationalIdentification,
          dateOfBirth,
          placeOfBirth,
          countryOfResidence,
        ]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/TravelRulePersonKind' }
        primaryIdentifier: { type: string, minLength: 1, maxLength: 100 }
        secondaryIdentifier: { type: [string, 'null'], minLength: 1, maxLength: 100 }
        accountNumber: { type: string, minLength: 1, maxLength: 100 }
        address:
          oneOf:
            - $ref: '#/components/schemas/TravelRuleAddress'
            - type: 'null'
        nationalIdentification:
          oneOf:
            - $ref: '#/components/schemas/TravelRuleNationalId'
            - type: 'null'
        dateOfBirth: { type: [string, 'null'], format: date }
        placeOfBirth: { type: [string, 'null'], minLength: 1, maxLength: 70 }
        countryOfResidence:
          oneOf:
            - $ref: '#/components/schemas/CountryCode'
            - type: 'null'
    TravelRuleVasp:
      type: object
      required: [name, lei]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        lei: { type: [string, 'null'], pattern: '^[A-Z0-9]{18}[0-9]{2}$' }
    TravelRuleRecord:
      type: object
      description: Commitment'ın girdisi; RFC 8785 kanonik JSON'unun SHA-256'sı `recordDigest`'tir.
      required: [originator, beneficiary, originatingVasp, beneficiaryVasp, amount, mint]
      additionalProperties: false
      properties:
        originator: { $ref: '#/components/schemas/TravelRulePerson' }
        beneficiary: { $ref: '#/components/schemas/TravelRulePerson' }
        originatingVasp:
          oneOf:
            - $ref: '#/components/schemas/TravelRuleVasp'
            - type: 'null'
        beneficiaryVasp:
          oneOf:
            - $ref: '#/components/schemas/TravelRuleVasp'
            - type: 'null'
        amount: { $ref: './schemas/idl.json#/U64' }
        mint: { $ref: './schemas/idl.json#/Address' }
    TravelRulePut:
      type: object
      required: [record]
      additionalProperties: false
      properties:
        record: { $ref: '#/components/schemas/TravelRuleRecord' }
    TravelRuleStatus:
      type: object
      required: [job, commitment, recordDigest, storedBy, storedAt, retainUntil, purgedAt, chainCommitment, committed]
      additionalProperties: false
      properties:
        job: { $ref: './schemas/idl.json#/Address' }
        commitment: { $ref: './schemas/idl.json#/Hex32' }
        recordDigest: { $ref: './schemas/idl.json#/Hex32' }
        storedBy: { $ref: './schemas/idl.json#/Address' }
        storedAt: { type: integer, format: int64 }
        retainUntil: { type: integer, format: int64 }
        purgedAt: { type: [integer, 'null'], format: int64 }
        chainCommitment:
          oneOf:
            - $ref: './schemas/idl.json#/Hex32'
            - type: 'null'
        committed: { type: boolean }
    TravelRuleDisclosure:
      type: object
      required: [status, record, salt]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/TravelRuleStatus' }
        record: { $ref: '#/components/schemas/TravelRuleRecord' }
        salt: { $ref: './schemas/idl.json#/Hex32' }
    TravelRuleGrantCreate:
      type: object
      required: [grantee, purpose, expiresAt]
      additionalProperties: false
      properties:
        grantee: { $ref: './schemas/idl.json#/Address' }
        purpose: { type: string, minLength: 1, maxLength: 200 }
        expiresAt: { type: integer, format: int64 }
    TravelRuleGrant:
      type: object
      required: [job, grantee, purpose, grantedBy, grantedAt, expiresAt, revokedAt]
      additionalProperties: false
      properties:
        job: { $ref: './schemas/idl.json#/Address' }
        grantee: { $ref: './schemas/idl.json#/Address' }
        purpose: { type: string, minLength: 1, maxLength: 200 }
        grantedBy: { $ref: './schemas/idl.json#/Address' }
        grantedAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        revokedAt: { type: [integer, 'null'], format: int64 }
    TravelRuleAccessAction:
      type: string
      enum: [store, read, grant, revoke, purge]
    TravelRuleAccess:
      type: object
      required: [id, job, action, actor, grantee, requestId, at]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1 }
        job: { $ref: './schemas/idl.json#/Address' }
        action: { $ref: '#/components/schemas/TravelRuleAccessAction' }
        actor:
          oneOf:
            - $ref: './schemas/idl.json#/Address'
            - type: 'null'
        grantee:
          oneOf:
            - $ref: './schemas/idl.json#/Address'
            - type: 'null'
        requestId: { type: [string, 'null'] }
        at: { type: integer, format: int64 }
    CctpTransferStatus:
      type: string
      enum: [pendingAttestation, attested, received, funded, failed]
    CctpTransferCreate:
      type: object
      required: [sourceDomain, sourceTxHash, job]
      additionalProperties: false
      properties:
        sourceDomain:
          { type: integer, minimum: 0, maximum: 4294967295, description: Burn'ün yapıldığı zincirin Circle domain'i. }
        sourceTxHash: { type: string, pattern: '^0x[0-9a-fA-F]{64}$', description: Burn tx'i (EVM). }
        job: { $ref: './schemas/idl.json#/Address' }
    CctpTransfer:
      type: object
      required:
        - id
        - sourceDomain
        - sourceTxHash
        - job
        - institution
        - mintRecipient
        - status
        - nonce
        - message
        - attestation
        - amount
        - feeExecuted
        - minted
        - attestedAt
        - receiveSignature
        - fundSignature
        - error
        - attempts
        - nextAttemptAt
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        sourceDomain: { type: integer, minimum: 0, maximum: 4294967295 }
        sourceTxHash: { type: string, pattern: '^0x[0-9a-f]{64}$' }
        job: { $ref: './schemas/idl.json#/Address' }
        institution: { $ref: './schemas/idl.json#/Address' }
        mintRecipient:
          allOf:
            - $ref: './schemas/idl.json#/Address'
          description: Beklenen mint alıcısı, kurumun USDC token hesabı.
        status: { $ref: '#/components/schemas/CctpTransferStatus' }
        nonce:
          oneOf:
            - $ref: './schemas/idl.json#/Hex32'
            - type: 'null'
        message: { type: [string, 'null'], pattern: '^(?:[0-9a-f]{2})+$', description: "Attestation'lı mesaj, hex." }
        attestation: { type: [string, 'null'], pattern: '^(?:[0-9a-f]{2})+$' }
        amount:
          oneOf:
            - $ref: './schemas/idl.json#/U64'
            - type: 'null'
        feeExecuted:
          oneOf:
            - $ref: './schemas/idl.json#/U64'
            - type: 'null'
        minted:
          oneOf:
            - $ref: './schemas/idl.json#/U64'
            - type: 'null'
        attestedAt: { type: [integer, 'null'], format: int64 }
        receiveSignature: { type: [string, 'null'], pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$' }
        fundSignature: { type: [string, 'null'], pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$' }
        error: { type: [string, 'null'] }
        attempts: { type: integer, minimum: 0 }
        nextAttemptAt: { type: [integer, 'null'], format: int64 }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    CctpFundTxRequest:
      type: object
      required: [feePayer, computeUnitPrice]
      additionalProperties: false
      properties:
        feePayer: { $ref: './schemas/idl.json#/Address' }
        computeUnitPrice:
          oneOf:
            - $ref: './schemas/idl.json#/U64'
            - type: 'null'
    CctpFundTx:
      type: object
      required: [step, transfer, tx]
      additionalProperties: false
      properties:
        step: { type: string, enum: [receiveAndFund, fund] }
        transfer: { $ref: '#/components/schemas/CctpTransfer' }
        tx: { $ref: '#/components/schemas/UnsignedTx' }

    # ------------------------------------------------------------ fiat (BE-25, ADR 0024, ADR 0026)
    FiatCurrency:
      type: string
      enum: [usd]
    FiatPaymentStatus:
      type: string
      enum:
        - requires_payment_method
        - requires_confirmation
        - requires_action
        - processing
        - requires_capture
        - canceled
        - succeeded
    FiatPaymentVia:
      type: string
      enum: [intent, mpp]
    FiatAttestationSource:
      type: string
      enum: [webhook, reconcile, mpp]
    FiatConfig:
      type: object
      required: [currency, publishableKey, mppAuthority, mppNetworkId, minimumAmountMinor]
      additionalProperties: false
      properties:
        currency: { $ref: '#/components/schemas/FiatCurrency' }
        publishableKey: { type: string, pattern: '^pk_(test|live)_[A-Za-z0-9]+$' }
        mppAuthority:
          allOf:
            - $ref: './schemas/idl.json#/Address'
          description: '`VerifierConfig.mpp_authority`.'
        mppNetworkId:
          type: [string, 'null']
          minLength: 1
          description: MPP challenge'ındaki Stripe profil kimliği; MPP kapalıysa null.
        minimumAmountMinor: { type: integer, minimum: 1, description: Stripe'ın en düşük kart ödemesi (sent). }
    FiatSetupIntentCreate:
      type: object
      required: [institution]
      additionalProperties: false
      properties:
        institution: { $ref: './schemas/idl.json#/Address' }
    FiatSetupIntent:
      type: object
      required: [institution, customer, setupIntent, clientSecret]
      additionalProperties: false
      properties:
        institution: { $ref: './schemas/idl.json#/Address' }
        customer: { type: string, pattern: '^cus_[A-Za-z0-9]+$' }
        setupIntent: { type: string, pattern: '^seti_[A-Za-z0-9]+$' }
        clientSecret: { type: string, minLength: 1 }
    FiatCard:
      type: object
      required: [paymentMethod, brand, last4, expMonth, expYear]
      additionalProperties: false
      properties:
        paymentMethod: { type: string, pattern: '^pm_[A-Za-z0-9]+$' }
        brand: { type: string, minLength: 1 }
        last4: { type: string, pattern: '^[0-9]{4}$' }
        expMonth: { type: integer, minimum: 1, maximum: 12 }
        expYear: { type: integer, minimum: 2000 }
    FiatCustomer:
      type: object
      required: [institution, customer, card]
      additionalProperties: false
      properties:
        institution: { $ref: './schemas/idl.json#/Address' }
        customer: { type: string, pattern: '^cus_[A-Za-z0-9]+$' }
        card:
          oneOf:
            - $ref: '#/components/schemas/FiatCard'
            - type: 'null'
    FiatPaymentCreate:
      type: object
      required: [offSession]
      additionalProperties: false
      properties:
        offSession: { type: boolean, description: true ise kayıtlı kartla hemen öder. }
    FiatAttestation:
      type: object
      description: |
        Kanonik Stripe makbuzu ve MPP authority'nin attestation'ı. `receiptHash` = Poseidon(alan(paymentIntent),
        amountMinor, alan(currency), alan(customer ?? ""), paidAt); alan(s) = Poseidon(s'nin 32'ye sıfırla doldurulmuş
        UTF-8 baytlarının iki 16 baytlık yarısı). `signature`, `"square/mpp-attestation/v1" ‖ job ‖ receiptHash ‖
        amount (u64 LE)` mesajının ed25519 imzasıdır (ADR 0024 §3).
      required:
        - job
        - institution
        - amount
        - paymentIntent
        - amountMinor
        - currency
        - customer
        - paidAt
        - receiptHash
        - authority
        - signature
        - source
      additionalProperties: false
      properties:
        job: { $ref: './schemas/idl.json#/Address' }
        institution: { $ref: './schemas/idl.json#/Address' }
        amount:
          allOf:
            - $ref: './schemas/idl.json#/U64'
          description: Job'un tutarı, settlement mint'inin taban biriminde.
        paymentIntent: { type: string, pattern: '^pi_[A-Za-z0-9]+$' }
        amountMinor: { type: integer, minimum: 1 }
        currency: { $ref: '#/components/schemas/FiatCurrency' }
        customer: { type: [string, 'null'], pattern: '^cus_[A-Za-z0-9]+$' }
        paidAt: { type: integer, format: int64 }
        receiptHash: { $ref: './schemas/idl.json#/Hex32' }
        authority: { $ref: './schemas/idl.json#/Address' }
        signature: { type: string, pattern: '^[1-9A-HJ-NP-Za-km-z]{64,88}$' }
        source: { $ref: '#/components/schemas/FiatAttestationSource' }
    FiatPayment:
      type: object
      required: [job, paymentIntent, via, status, amountMinor, currency, clientSecret, attestation]
      additionalProperties: false
      properties:
        job: { $ref: './schemas/idl.json#/Address' }
        paymentIntent: { type: string, pattern: '^pi_[A-Za-z0-9]+$' }
        via: { $ref: '#/components/schemas/FiatPaymentVia' }
        status: { $ref: '#/components/schemas/FiatPaymentStatus' }
        amountMinor: { type: integer, minimum: 1 }
        currency: { $ref: '#/components/schemas/FiatCurrency' }
        clientSecret: { type: [string, 'null'], minLength: 1 }
        attestation:
          oneOf:
            - $ref: '#/components/schemas/FiatAttestation'
            - type: 'null'
    StripeWebhookReceipt:
      type: object
      required: [event, type, recorded]
      additionalProperties: false
      properties:
        event: { type: string, pattern: '^evt_[A-Za-z0-9]+$' }
        type: { type: string, minLength: 1 }
        recorded:
          type: boolean
          description: Olay bir kaydı değiştirdi (attestation ya da kart).
