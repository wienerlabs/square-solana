openapi: 3.1.0
info:
  title: Square Solana API
  version: 0.25.0
  summary: Square HTTP API sözleşmesi (BE-35), uygulaması apps/api (BE-18).
  description: |
    Contract-first API sözleşmesi. Zincirdeki hesaplar, event'ler ve instruction argümanları
    BC-44 IDL'lerinden üretilen `schemas/idl.json` şemalarıyla taşınır. Elle yazılan şemalar
    `@squaresdk/solana-types` zod şemalarıyla birebir aynıdır (test: packages/types/test).

    JSON kodlaması: adresler base58, u64 ondalık string, 32 baytlık değerler küçük harf hex,
    zamanlar unix saniyesi, alan adları camelCase. Tüm `/v1` yanıtları `{ success, data, error, meta }`
    zarfıyla döner. Ayrıntılar: docs/design/api-sdk-contract.md.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
tags:
  - name: auth
    description: Cüzdan Ed25519 oturumu ve API anahtarları.
  - name: x402
    description: |
      Geliştiricinin x402 ücretli uç nokta tanımları ve kullanımı (FE-22, ADR 0023). Ödemeyi geliştiricinin
      sunucusu `@squaresdk/solana-x402` `paidRouteFromDefinition` ile ister ve uzlaştırılan ödemeyi bildirir.
  - name: jobs
    description: Job okuma uçları ve teslimat yükleme (adım 3–4, 6–8).
  - name: policies
    description: Kurum ve policy okuma uçları; policy içeriği asla API'ye gelmez (adım 1, 5).
  - name: agents
    description: Agent kayıtları, agent card barındırma ve A2A keşif yolu (adım 2).
  - name: claims
    description: Alacak piyasası okuma uçları (adım 5).
  - name: disputes
    description: Dispute okuma uçları, dispute kanıtı ve arbitrator oyu (BE-22).
  - name: arbitration
    description: Arbitrator kuyruğu ve webhook bildirim abonelikleri (BE-22).
  - name: screening
    description: Sanctions screening kayıtları (adım 3).
  - name: events
    description: İndexlenmiş zincir event'leri.
  - name: keeper
    description: Keeper günlüğü (finalize ve lapse crank kararları).
  - name: travel-rule
    description: |
      Travel Rule kaydı (adım 3, BE-23, ADR 0017). Kayıt API'de zarf şifrelemesiyle saklanır; zincire yalnızca
      salt'lı commitment'ı gider (`commitTravelRule`). Kaydı kurumun güncel yetkilisi yazar ve izin verdiği
      cüzdanlar (karşı VASP, denetçi) okur. Kişisel veriye dokunan her işlem erişim kaydına yazılır.
  - name: cctp
    description: |
      CCTP ile cross-chain fonlama (BE-26, docs/design/cctp-funding.md). Kurum kaynak zincirdeki burn tx'ini bir
      job'a bağlar; relayer Circle'ın attestation'ını izler. Mesaj imzalanınca kurum mint ile fonlamayı tek tx'te
      imzalar; relayer mesajı önce teslim ettiyse yalnızca fonlamayı.
  - name: fiat
    description: |
      Stripe MPP fiat rayı (BE-25, ADR 0024, ADR 0026). Kurum teslim edilmiş fiat işi Stripe ile öder: tarayıcıda,
      kayıtlı kartla off-session ya da MPP 402 akışıyla. Square'in MPP authority'si başarılı ödemenin makbuz
      commitment'ını işe ve tutara bağlayarak imzalar; kurum attestation'ı ispatla `verify_mpp_payment_proof`'a verir.
  - name: tx
    description: 8 adımın imzasız tx hazırlığı.
  - name: prover
    description: Uzak prover (adım 7). Güven sınırı için ProveRequest açıklamasına bakın.
  - name: health
    description: Sağlık ve hazırlık kontrolleri.

security: []

paths:
  /v1/auth/challenge:
    post:
      tags: [auth]
      operationId: createAuthChallenge
      summary: Cüzdan için imzalanacak oturum mesajı üretir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthChallengeRequest' }
      responses:
        '200':
          description: İmzalanacak mesaj.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/AuthChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/session:
    post:
      tags: [auth]
      operationId: createSession
      summary: İmzalı mesajla oturum açar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRequest' }
      responses:
        '200':
          description: Oturum.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [auth]
      operationId: deleteSession
      summary: Oturumu kapatır.
      security:
        - session: []
      responses:
        '204':
          description: Oturum kapatıldı.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/api-keys:
    get:
      tags: [auth]
      operationId: listApiKeys
      summary: Oturum sahibinin API anahtarlarını listeler.
      security:
        - session: []
      responses:
        '200':
          description: API anahtarları.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [auth]
      operationId: createApiKey
      summary: API anahtarı oluşturur; gizli değer yalnızca bu yanıtta döner.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: Oluşturulan anahtar.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/ApiKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/api-keys/{id}:
    delete:
      tags: [auth]
      operationId: deleteApiKey
      summary: API anahtarını iptal eder.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          description: 'API anahtarının kimliği (`listApiKeys`).'
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '204':
          description: İptal edildi.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/x402/endpoints:
    get:
      tags: [x402]
      operationId: listX402Endpoints
      summary: Çağıranın cüzdanına ait ücretli uç nokta tanımlarını listeler.
      security:
        - session: []
        - apiKey: []
      description: Anahtarla gelen istek `x402:serve` kapsamı ister.
      responses:
        '200':
          description: Tanımlar, yeniden eskiye.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/X402Endpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [x402]
      operationId: createX402Endpoint
      summary: Ücretli uç nokta tanımı oluşturur.
      description: Yol cüzdan başına tekildir; aynı yolda ikinci tanım 409 alır.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/X402EndpointCreate' }
      responses:
        '201':
          description: Oluşturulan tanım.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/X402Endpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/x402/endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/X402EndpointPath'
    get:
      tags: [x402]
      operationId: getX402Endpoint
      summary: Tek ücretli uç nokta tanımı (geliştiricinin sunucusu bunu okuyarak ödeme ister).
      description: Anahtarla gelen istek `x402:serve` kapsamı ister.
      security:
        - session: []
        - apiKey: []
      responses:
        '200':
          description: Tanım.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/X402Endpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [x402]
      operationId: updateX402Endpoint
      summary: Tanımı kısmen günceller (ör. etkin / pasif, fiyat).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/X402EndpointUpdate' }
      responses:
        '200':
          description: Güncel tanım.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/X402Endpoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [x402]
      operationId: deleteX402Endpoint
      summary: Tanımı ve kullanım kaydını siler.
      security:
        - session: []
      responses:
        '204':
          description: Silindi.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/x402/endpoints/{id}/usage:
    get:
      tags: [x402]
      operationId: getX402EndpointUsage
      summary: Kullanım - ödemeli çağrı sayısı, tahsil edilen tutar ve son ödemeler.
      description: Anahtarla gelen istek `x402:serve` kapsamı ister.
      security:
        - session: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/X402EndpointPath'
      responses:
        '200':
          description: Kullanım özeti.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/X402EndpointUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/x402/endpoints/{id}/payments:
    post:
      tags: [x402]
      operationId: recordX402Payment
      summary: Geliştiricinin sunucusunun uzlaştırdığı ödemeyi kaydeder.
      description: |
        Kayıt ödeme yükünün kimliğiyle (`fingerprint`) idempotenttir: aynı kimlik ikinci kez bildirilirse ilk kayıt
        döner (200), yeni kayıt 201 alır. Ödemenin ağı, mint'i ve alıcısı tanımınkiyle aynı olmalıdır.
        Anahtarla gelen istek `x402:serve` kapsamı ister.
      security:
        - session: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/X402EndpointPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/X402PaymentReport' }
      responses:
        '200':
          description: Bu ödeme daha önce kaydedilmiş; ilk kayıt.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/X402Payment' }
        '201':
          description: Kaydedilen ödeme.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/X402Payment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Job'ları filtreleyerek listeler.
      parameters:
        - name: status
          in: query
          description: 'Job durumu.'
          schema: { $ref: './schemas/idl.json#/JobStatus' }
        - name: institution
          in: query
          description: "Job'u açan kurum anahtarı (`institution`; Squads vault'u da olabilir)."
          schema: { $ref: './schemas/idl.json#/Address' }
        - name: agentRecord
          in: query
          description: "Job'un bağlı olduğu agent kaydı."
          schema: { $ref: './schemas/idl.json#/Address' }
        - name: policy
          in: query
          description: "Job'un bağlı olduğu politika."
          schema: { $ref: './schemas/idl.json#/Address' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sayfalı job listesi.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JobView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/jobs/{job}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Tek job; payee, claim, ReleaseProof ve validation kaydıyla.
      parameters:
        - $ref: '#/components/parameters/JobPath'
      responses:
        '200':
          description: Job görünümü.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/JobView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/jobs/{job}/deliveries:
    post:
      tags: [jobs]
      operationId: uploadDelivery
      summary: Teslimatı yükler; `submit_work` için workHash ve deliveryUri döner.
      security:
        - session: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/JobPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '201':
          description: Yükleme makbuzu.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/DeliveryReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/institutions/{institution}:
    get:
      tags: [policies]
      operationId: getInstitution
      summary: Kurum hesabı (square_policy `Institution`).
      parameters:
        - name: institution
          in: path
          description: 'Kurum hesabının (`Institution` PDA) adresi.'
          required: true
          schema: { $ref: './schemas/idl.json#/Address' }
      responses:
        '200':
          description: Kurum görünümü.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/InstitutionView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/policies:
    get:
      tags: [policies]
      operationId: listPolicies
      summary: Policy hesaplarını ve herkese açık meta verilerini listeler.
      parameters:
        - name: institution
          in: query
          description: 'Politikanın kurum hesabı.'
          schema: { $ref: './schemas/idl.json#/Address' }
        - name: active
          in: query
          description: 'Yalnızca etkin (`true`) ya da devre dışı (`false`) politikalar.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sayfalı policy listesi.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PolicyView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/policies/{policy}:
    get:
      tags: [policies]
      operationId: getPolicy
      summary: Tek policy.
      parameters:
        - $ref: '#/components/parameters/PolicyPath'
      responses:
        '200':
          description: Policy görünümü.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/PolicyView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/policies/{policy}/meta:
    put:
      tags: [policies]
      operationId: putPolicyMeta
      summary: Policy'nin herkese açık meta verisini yazar (kurumun güncel yetkilisi).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/PolicyPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyMeta' }
      responses:
        '200':
          description: Güncel policy görünümü.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/PolicyView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: Agent kayıtlarını listeler.
      parameters:
        - name: owner
          in: query
          description: 'Agent kaydının sahibi.'
          schema: { $ref: './schemas/idl.json#/Address' }
        - name: status
          in: query
          description: 'Agent kaydının durumu.'
          schema: { $ref: './schemas/idl.json#/AgentStatus' }
        - name: skill
          in: query
          description: Agent card'daki beceri kimliği ya da etiketi.
          schema: { type: string, minLength: 1, maxLength: 64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sayfalı agent listesi.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AgentView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/agents/{agentRecord}:
    get:
      tags: [agents]
      operationId: getAgent
      summary: Tek agent; DID, doğrulanmış agent card ve itibar ile.
      parameters:
        - $ref: '#/components/parameters/AgentRecordPath'
      responses:
        '200':
          description: Agent görünümü.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
                      data: { $ref: '#/components/schemas/AgentView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/agents/{agentRecord}/card:
    put:
      tags: [agents]
      operationId: putAgentCard
      summary: Agent card'ı barındırır; `update_agent` için URI ve SHA-256 döner (kayıt sahibi).
      security:
        - session: []
        - apiKey: []
      description: |
        Kayıt zincirde (indexlenmiş) ise çağıran `AgentRecord.owner`'dır. Kart kayıttan önce yüklenirken
        (8 adımın 2.si) `agentId` verilir: `agentRecord`, çağıranın cüzdanı ve bu kimlikle türetilen PDA
        (`["agent", owner, agent_id]`) olmalıdır. Kartın `registrations`'ı bu kaydı içermelidir. Saklanan
        baytlar kartın RFC 8785 kanonik JSON'udur; `agentCardHash` bu baytların SHA-256'sıdır.
      parameters:
        - $ref: '#/components/parameters/AgentRecordPath'
        - name: agentId
          in: query
          description: "`register_agent`'ın `agent_id`'si; yalnızca kayıt henüz yokken gerekir."
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCard' }
      responses:
        '200':
          description: Barındırılan kartın adresi ve hash'i.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessBase'
                  - properties:
