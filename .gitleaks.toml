# gitleaks yapılandırması.
#
# Varsayılan kural seti olduğu gibi kullanılır. İstisnalar, Arc Square'deki düzende olduğu gibi,
# YOL değil DEĞER bazında ve gerekçesiyle yazılır: yol bazında bir istisna o dosyaya sonradan
# girecek gerçek bir sırrı da görünmez yapar.
#
# BC-13: CI kapısı (.github/workflows/security.yml) ve yerel pre-commit kancası (.githooks/pre-commit)
# bu dosyayı kullanır. Covenant'ın secret-scan işindeki grep korumasından Solana anahtar dizisi
# denetimi aşağıdaki iki kurala uyarlandı (varsayılan kurallar bayt dizisi biçimindeki anahtarı hiç
# yakalamıyor). Token önekleri (ghp_, npm_, AKIA, sk-ant- …) varsayılan kurallarda zaten var;
# Covenant'ın yol bazlı istisnaları (app/tests/**, README.md) bu politikaya aykırı olduğu için
# alınmadı. Kuralların testi: scripts/security/gitleaks-rules.check.mjs.
#
# Not: tekil [allowlist] bloğundaki `regexes`, `useDefault = true` ile birlikte uygulanmaz;
# çoğul [[allowlists]] + `regexTarget` kullanılır (gitleaks 8.30).

[extend]
useDefault = true

[[rules]]
id = "solana-keypair-file"
description = """Solana keypair dosyası (solana-keygen biçimi): JSON dosyasının tamamı 64 baytlık bir dizi.
Dosyanın yalnızca dizi olması şartı, aynı uzunluktaki açık verileri (Groth16 ispat noktaları,
doğrulama anahtarı) dışarıda bırakır."""
path = '''(?i)\.json$'''
regex = '''\A\s*\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]\s*\z'''

[[rules]]
id = "solana-secret-key-array"
description = """Solana gizli anahtarı 64 baytlık dizi olarak: `Keypair.fromSecretKey(...)` içinde ya da
secret / private key / keypair adlı bir alanın değeri (TS, JSON, .env, Rust `[u8; 64]`). Adsız 64
baytlık diziler (ispat, doğrulama anahtarı) eşleşmez."""
regex = '''(?i)(?:fromSecretKey\s*\(|(?:secret|private)[_-]?key|keypair)[^\[]{0,60}(?:\[u8;\s*64\][^\[]{0,10})?\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*,?\s*\]'''
keywords = ["secret", "private", "keypair"]

[[allowlists]]
description = """Ed25519 did:key tanımlayıcıları açık anahtardır, sır değildir: did:key:z6Mk…
multicodec 0xed01 önekli bir Ed25519 açık anahtarının base58btc kodlamasıdır (did:aip test
vektörleri, docs/did-aip/). generic-api-key kuralı `key:` ve ardından gelen yüksek entropili
değer yüzünden takılıyor. regexTarget = "match": yalnızca eşleşmesi tam olarak bir did:key
parçası olan bulgu bastırılır; aynı satırdaki başka bir sır yine yakalanır (yerelde doğrulandı)."""
regexTarget = "match"
regexes = ['''^key:z6Mk[1-9A-HJ-NP-Za-km-z]{44}"?$''']

[[allowlists]]
description = """BC-05 ile gelen Aperture verifier'ındaki Groth16 doğrulama anahtarı sabitleri:
doğrulama anahtarı herkese açıktır, sır değildir. generic-api-key kuralının "sır" sandığı değer
aslında tip adı (`Groth16Verifyingkey`). .gitleaksignore'daki parmak izleri commit'e bağlı
olduğundan yalnızca `gitleaks git` taramasında işe yarar; bu istisna `gitleaks dir` için de
geçerlidir. Satır bazında ve yalnızca bu iki sabit: VK satırının hemen altına ya da dosyanın
sonuna konan sahte bir sır yine yakalandı (yerelde doğrulandı). VK yeniden üretilip sabit adı
değişirse (BC-20, BC-21) burası da güncellenir. BC-20: release devresinin anahtarı
`SQUARE_RELEASE_VK` (programs/square-verifier/src/release_vk.rs, pipeline üretir) eklendi."""
regexTarget = "line"
# gitleaks "line" hedefine bulgunun öncesinden bağlam da girer; ^ ve $ satır başına (?m) ile bağlanır.
regexes = ['''(?m)^pub const (APERTURE_(PAYMENT|BATCH)|SQUARE_RELEASE)_VK: Groth16Verifyingkey = Groth16Verifyingkey \{$''']

[[allowlists]]
description = """BE-02 ile gelen prover'ın VK dönüştürme betiği (apps/prover/scripts/extract-vk-rust.mjs):
yukarıdaki VK sabitlerini üreten satırın şablonu. generic-api-key kuralının "sır" sandığı değer
yine tip adı (`Groth16Verifyingkey`). Satır bazında ve yalnızca bu şablon."""
regexTarget = "line"
# Kaynak geçmişinde şablon kendi satırında, Prettier sonrası console.log(...) içinde tek satır.
regexes = ['''(?m)^\s*(console\.log\()?`pub const \$\{constName\}: Groth16Verifyingkey = Groth16Verifyingkey \{`(,|\);)?$''']

[[allowlists]]
description = """BE-02 ile gelen prover fixture'ları ve README'deki istek örneği: `payment_token_mint`
alanında Solana mainnet USDC mint adresi (EPjF…). Mint adresi açık anahtardır, sır değildir.
Satır bazında, yalnızca bu alan adı ve bu adresle."""
regexTarget = "line"
regexes = ['''(?m)^\s*"?payment_token_mint"?:\s*['"]EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v['"],?$''']

[[allowlists]]
description = """BC-36 ile gelen CCTP V2 adresleri: Circle'ın Solana devnet programı
(TokenMessengerMinterV2), onun PDA'ları (token_messenger, remote_token_messenger, token_minter,
local_token, token_pair; devnet'te getAccountInfo ile okunur) ve Sepolia sözleşmeleri
(TokenMessengerV2, USDC). Hepsi zincirde herkese açık adreslerdir, sır değildir. generic-api-key
kuralı alan adındaki "token" yüzünden takılıyor. regexTarget = "secret": yalnızca değeri tam olarak
bu adreslerden biri olan bulgu bastırılır; aynı satırdaki başka bir sır yine yakalanır."""
regexTarget = "secret"
regexes = [
  '''^CCTPV2vPZJS2u2BBsUoscuikbYjnpFmbFsvVuJdgUMQe$''',
  '''^AawthJCGRmggpfv9MMWV6Jmo9cue4gL9wUZgRBShg58W$''',
  '''^3EzN2mcmdfSNGXRCAixSpTteK6ywdmFDZZWvkMnznFt9$''',
  '''^E1bQJ8eMMn3zmeSewW3HQ8zmJr7KR75JonbwAtWx2bux$''',
  '''^7MwmWTK2R9Na6rnoSAEt5gytFmSZj9WLVdazvxvru9AU$''',
  '''^AR6mnr7XRVDUvK7SDGKpREBwGQMxZbKRsY22gXN8bvQU$''',
  '''(?i)^0x8FE6B999Dc680CcFDD5Bf7EB0974218be2542DAA$''',
  '''(?i)^0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238$''',
]
