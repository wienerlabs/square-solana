[workspace]
resolver = "2"
members = ["programs/*", "interfaces/*", "crates/*"]
# interfaces/ kendi Anchor.toml'u ile ayrı bir Anchor workspace'i; onun çıktı klasörü crate değildir.
exclude = ["interfaces/target"]

# Proje lisansı (BC-02, docs/licensing.md); crate'ler `license.workspace = true` ile devralabilir.
[workspace.package]
license = "Apache-2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
