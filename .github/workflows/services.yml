name: Services

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/web/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGAVE_VERSION: 4.1.2
  AGAVE_SHA256: 5991d027a686eb419a709a479178b33eb83501e8a2bfbf599a81a286bfcbf770
  ANCHOR_VERSION: 1.2.0
  ANCHOR_SHA256: 0c9c41a3292c281cc6eadb78d6e1c8224d8324a34b0736a89d640fd314db05b7
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  localnet:
    name: Servisler localnet'te (8 adım, gerçek programlar)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Araç sürümleri Anchor.toml ile aynı
        run: node scripts/ci/toolchain.mjs

      - name: Rust toolchain
        run: rustup toolchain install || rustup show

      - name: Agave ve Anchor CLI
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o agave.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/v${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "${AGAVE_SHA256}  agave.tar.bz2" | sha256sum -c -
          tar -xjf agave.tar.bz2
          mkdir -p bin
          curl -sSfL -o bin/anchor \
            "https://github.com/solana-foundation/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          echo "${ANCHOR_SHA256}  bin/anchor" | sha256sum -c -
          chmod +x bin/anchor
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/solana
            target
          key: services-${{ runner.os }}-${{ env.AGAVE_VERSION }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: services-${{ runner.os }}-${{ env.AGAVE_VERSION }}-

      - name: Programlar (anchor build)
        run: anchor build

      - name: Release devresi
        run: circuits/payment-compliance/scripts/ci-build.sh

      - name: Derleme
        run: pnpm turbo run build --filter @squaresdk/solana-services-e2e...

      - name: Servisler localnet'te
        timeout-minutes: 30
        env:
          SQUARE_SERVICES_LOG_DIR: ${{ runner.temp }}/services-logs
        run: pnpm --filter @squaresdk/solana-services-e2e test:localnet

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: services-logs
          path: ${{ runner.temp }}/services-logs
          if-no-files-found: ignore
