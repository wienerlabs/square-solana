# Verifiable build (BC-13): programlar solana-verify ile sabit bir Docker imajında yeniden derlenir ve her
# .so'nun executable hash'i yazılır. İmaj Agave sürümüne göre seçilir (Anchor.toml [toolchain],
# scripts/ci/toolchain.mjs denetler) ve digest'le sabitlenir; aynı commit'ten herkes aynı hash'i üretir.
# Deploy edilen program bu hash'le doğrulanır (`solana-verify get-program-hash`). Elle tetiklemede
# `rpc_url` verilirse programların zincirdeki hash'i de karşılaştırılır; program kimlikleri Anchor.toml'dan
# (Square'in kendi kimlikleri BC-09, devnet deploy'u BC-30). Yavaş ve Docker'a bağlı olduğu için PR'larda
# yalnızca bu dosya değişince koşar; main'de programları etkileyen her push'ta koşar.
name: Verifiable build

on:
  push:
    branches: [main]
    paths:
      - 'programs/**'
      - 'crates/**'
      - 'idl/**'
      - 'Anchor.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/verifiable-build.yml'
  pull_request:
    paths:
      - '.github/workflows/verifiable-build.yml'
  workflow_dispatch:
    inputs:
      rpc_url:
        description: "Zincirdeki programlarla karşılaştırmak için RPC adresi (boşsa yalnızca derleme ve hash'ler)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: verifiable-build-${{ github.ref }}
  cancel-in-progress: true

env:
  AGAVE_VERSION: 4.1.2
  BASE_IMAGE: solanafoundation/solana-verifiable-build:4.1.2@sha256:2e0b78f44ee76612e9260c7c988570c5e14de6fbd93e0ab07115ec7054473b4f
  VERIFY_VERSION: 0.5.2
  VERIFY_SHA256: b9d5ccce9634dc14269cab3e7a58649bc141b3306e7735a94478c936341f211f

jobs:
  build:
    name: Verifiable build (solana-verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Araç sürümleri Anchor.toml ile aynı
        run: node scripts/ci/toolchain.mjs

      - name: solana-verify (resmi ikili, SHA-256 doğrulanır)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/bin/solana-verify" \
            "https://github.com/solana-foundation/solana-verifiable-build/releases/download/v${VERIFY_VERSION}/solana-verify-${VERIFY_VERSION}-linux"
          echo "${VERIFY_SHA256}  $RUNNER_TEMP/bin/solana-verify" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/solana-verify"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/solana-verify" --version

      - name: Programlar (Docker'da deterministik derleme)
        run: |
          set -euo pipefail
          programs=$(node --input-type=module -e "import { PROGRAMS } from './scripts/ci/programs.mjs'; console.log(PROGRAMS.map((p) => p.name).join(' '))")
          for program in $programs; do
            echo "::group::$program"
            solana-verify build --base-image "$BASE_IMAGE" --library-name "$program"
            echo "::endgroup::"
          done

      - name: Executable hash'leri
        run: |
          set -euo pipefail
          mkdir -p verifiable
          {
            echo "### Verifiable build ($GITHUB_SHA)"
            echo
            echo "İmaj: \`$BASE_IMAGE\`"
            echo
            echo '| Program | Executable hash |'
            echo '|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          for so in target/deploy/*.so; do
            program=$(basename "$so" .so)
            hash=$(solana-verify get-executable-hash "$so")
            echo "$hash  $program.so" | tee -a verifiable/hashes.txt
            echo "| \`$program\` | \`$hash\` |" >> "$GITHUB_STEP_SUMMARY"
            cp "$so" verifiable/
          done
          echo "$BASE_IMAGE" > verifiable/base-image.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifiable-build-${{ github.sha }}
          path: verifiable/
          if-no-files-found: error

      # Program kimlikleri Anchor.toml [programs.localnet]'ten; zincirdeki hash farklıysa iş kırmızı olur.
      - name: Zincirdeki programlarla karşılaştırma
        if: github.event_name == 'workflow_dispatch' && inputs.rpc_url != ''
        env:
          RPC_URL: ${{ inputs.rpc_url }}
        run: |
          set -euo pipefail
          failed=0
          while read -r program id; do
            built=$(grep " $program.so\$" verifiable/hashes.txt | cut -d' ' -f1)
            onchain=$(solana-verify get-program-hash -u "$RPC_URL" "$id")
            if [ "$built" = "$onchain" ]; then
              echo "✓ $program ($id): $built"
            else
              echo "::error::$program ($id): derlenen $built, zincirde $onchain"
              failed=1
            fi
          done < <(sed -n '/^\[programs.localnet\]/,/^\[/p' Anchor.toml | sed -nE 's/^([a-z_]+) = "([1-9A-HJ-NP-Za-km-z]+)"/\1 \2/p')
          exit "$failed"
