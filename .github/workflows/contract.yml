# BE-35: API / SDK sözleşmesinin BC-44 IDL'leriyle (idl/*.json) hizası. Gerçek programlar geldikçe
# programların IDL'inin idl/ ile aynı olduğu denetimi BC-13'te eklenir.
# Derleme, tip kontrolü (IDL tip testleri dahil) ve hizalama testleri BE-03 ile packages.yml'e taşındı:
# idl/, docs/api/ ya da docs/did-aip/ değişen her PR orada tam koşu alır (scripts/ci/turbo-scope.mjs).
name: contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: IDL → zod / OpenAPI şemaları ve SDK tipleri güncel
        run: pnpm contract:check
      - name: OpenAPI lint
        run: pnpm openapi:lint
