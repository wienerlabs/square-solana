# BC-45 (#111): her PR'da proje sahibini reviewer olarak ister.
# CODEOWNERS bu repoda kullanılmaz (proje sahibi kararı): GitHub Free planında private repolarda
# otomatik atama yapmıyor. Bu iş akışı aynı işi Actions ile yapar.
#
# Güvenlik: `pull_request_target` taban dalın bağlamında çalışır ve fork PR'larında da yazma
# yetkili token alır. Bu yüzden PR'ın kodu hiçbir zaman checkout edilmez ve çalıştırılmaz; tek
# adım GitHub API'sine reviewer isteği gönderir.
name: reviewer

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

env:
  REVIEWER: MuhammedAkinci

jobs:
  request-review:
    # GitHub, PR'ın yazarını reviewer olarak eklemeye izin vermez; taslak PR'lar hazır olunca istenir.
    if: github.event.pull_request.user.login != 'MuhammedAkinci' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reviewer iste
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh api "repos/$REPO/pulls/$PR/requested_reviewers" -f "reviewers[]=$REVIEWER" --silent
