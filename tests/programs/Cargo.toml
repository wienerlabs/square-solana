# Programların LiteSVM testleri (BC-12). Kendi workspace'i ve Cargo.lock'u vardır: test araçlarının
# (litesvm, Agave çalışma zamanı) bağımlılıkları deploy edilen programların kök Cargo.lock'taki çözümünü
# değiştirmez. Testler kök workspace'te `anchor build` ile derlenen `target/deploy/*.so`'yu yükler.
[workspace]

[package]
name = "square-program-tests"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Square programlarının LiteSVM test altyapısı: harness, fikstürler, saat, event'ler, compute unit ölçümü (BC-12)"

[dependencies]
anchor-lang = "1.2.0"
base64 = "0.22"
# `precompiles`: MPP yolunun Ed25519 precompile talimatı (BC-37).
litesvm = { version = "0.16.0", features = ["precompiles"] }
solana-account = "4"
# İşlem bütçesi ölçümü (BC-28): address lookup table'ı ALT programının kendi talimatlarıyla kurmak için.
solana-address-lookup-table-interface = { version = "3", features = ["bincode"] }
solana-compute-budget-interface = "3"
solana-instruction-error = "2"
solana-keypair = "3"
solana-loader-v3-interface = "8"
solana-message = "4"
solana-program-pack = "3"
solana-sdk-ids = "3"
solana-signature = "3"
solana-signer = "3"
solana-slot-hashes = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = "4"
solana-transaction-error = "3"
spl-associated-token-account-interface = "2"
spl-token-interface = "2"
spl-token-2022-interface = "2"
square-common = { path = "../../crates/square-common" }

[dev-dependencies]
# Verifier testlerinin release ispatı fikstürü (tests/fixtures/release-proofs.json).
serde_json = "1"
solana-sha256-hasher = "3"
square-registry = { path = "../../programs/square-registry", features = ["no-entrypoint"] }
square-policy = { path = "../../programs/square-policy", features = ["no-entrypoint"] }
square-escrow = { path = "../../programs/square-escrow", features = ["no-entrypoint"] }
square-verifier = { path = "../../programs/square-verifier", features = ["no-entrypoint"] }
