[toolchain]
# Tek Anchor sürümü (BC-08, ADR 0007); Solana/Agave CLI Anchor 1.2.0'ın önerdiği sürüm.
anchor_version = "1.2.0"
solana_version = "4.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Kaynak programların declare_id! değerleri; yeni Square program ID'leri BC-09'da.
square_policy = "FXD7ycSguBQw7o3DXqq4VUBHtdx5ZQpu9P2zb4KG4ZEU"
verifier = "AzKirEv7h5PstLNYNqLj7fCXU9EFA6nSnuoed3QkmUfU"
aip_registry = "CgchXu2dRV3r9E1YjRhp4kbeLLtv1Xz61yoerJzp1Vbc"
square_escrow = "5hstj5grBUL1BeSaPLYpgkD6n3ALasmbseRvKRFfCVNT"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Birim testleri ve programların LiteSVM testleri (programs/*/tests, crates/square-testkit); testler
# `anchor build`'in ürettiği target/deploy/*.so'yu yükler (BC-12).
test = "cargo test --workspace --locked -- --nocapture"
