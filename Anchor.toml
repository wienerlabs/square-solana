[toolchain]
# Tek Anchor sürümü (BC-08, ADR 0007); Solana/Agave CLI Anchor 1.2.0'ın önerdiği sürüm.
anchor_version = "1.2.0"
solana_version = "4.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Square program kimlikleri (BC-09); scripts/deploy/set-program-ids.mjs yazar.
square_policy = "63HKPj2L8a9DGeTa9Eh3NaZXthMrFUEgbs9Y28SNEc4"
square_verifier = "8yLdDR5zoAzeEWzkNX19DKy4HfVYXb7VcU3wWStwTFPh"
square_registry = "AL5p4aTWrmBmWa4vxJFbBjQG7Xnx2juc15FJRGpwSsA9"
square_escrow = "6yBTEVbizMVCWAp4c3jx6Xdsay3CiUmrJmTswY7QRWaX"

[programs.devnet]
# Square program kimlikleri (BC-09); scripts/deploy/set-program-ids.mjs yazar.
square_policy = "63HKPj2L8a9DGeTa9Eh3NaZXthMrFUEgbs9Y28SNEc4"
square_verifier = "8yLdDR5zoAzeEWzkNX19DKy4HfVYXb7VcU3wWStwTFPh"
square_registry = "AL5p4aTWrmBmWa4vxJFbBjQG7Xnx2juc15FJRGpwSsA9"
square_escrow = "6yBTEVbizMVCWAp4c3jx6Xdsay3CiUmrJmTswY7QRWaX"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Program testleri LiteSVM'de, `anchor build`'in ürettiği target/deploy/*.so ile koşar (BC-12, tests/programs).
test = "cargo test --locked --manifest-path tests/programs/Cargo.toml -- --nocapture"
