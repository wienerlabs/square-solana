# OpenAPI lint yapılandırması (BE-35). `pnpm openapi:lint` ile çalışır.
extends:
  - recommended

apis:
  square:
    root: docs/api/openapi.yaml

rules:
  # Sunucu adresi spec'te sabitlenmez; ortam yapılandırmasından gelir (BE-18 / BE-20).
  no-empty-servers: off
  operation-4xx-response: error
  operation-operationId: error
  tag-description: error
  # API referansının bütünlüğü (BE-31): her operasyonun özeti, başarılı yanıtı ve tanımlı etiketi, her
  # parametrenin açıklaması; kullanılmayan bileşen yok.
  operation-summary: error
  operation-2xx-response: error
  operation-tag-defined: error
  parameter-description: error
  no-unused-components: error
